<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="back">
    <div class="fun">
    <div class="deg">
        <p>Degrees</p>
        <input id="a1"  class="a1">
    </div>
    <div class="typee">
        <p>Type</p>
        <select id="a2" class="a2"><option>fahrenheit </option>
            <option>Celsius</option></select>
    </div>
    <button class="a3">Covert</button>
</div>
<div class="res">
    <p>Result</p>
    <h3 id="a4"></h3>
</div>
</div>

<script>
    const deg=document.getElementById('a1').value;
    const sel=document.querySelector('.a2').value;
    const ress=document.querySelector('#a4');
   const butt=document.querySelector('.a3');
   


butt.addEventListener('click',function(){
    const deg=document.getElementById('a1').value;
    const sel=document.querySelector('.a2').value;
    if(sel=='fahrenheit'){
        var res=(9/5) * deg+ 32
        console.log(res);
        ress.textContent=Math.round(res);
    }
    else{
        var res=(deg-32)*5/9;
      
        ress.textContent=Math.round(res);
    }
})

    




</script>



</body>

</html>
